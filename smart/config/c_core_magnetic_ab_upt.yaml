defaults:
  - c_core_magnetic_common
  - _self_

experiment:
  name: "C_CORE_MAGNETIC_AB_UPT_BASE"
  model_name: "AB_UPT_C_CORE_MAGNETIC"
  batch_size: 2
  cuda_batch_prefetch: false
  prefetch_factor: 1
  architecture:
    hidden_dim: 192
    num_heads: 6
    geometry_supernodes: 512
    supernode_neighbors: 32
    surface_anchors: 256
    volume_anchors: 256
    geometry_depth: 2
    interleaved_depth: 2
    final_self_depth: 6
    domain_decoder_depth: 2
    dropout: 0.0
    pos_scale_factor: 100.0
    knn_chunk_size: 64
    query_chunk_size: 4096
