defaults:
  - toy_heat_exchange_satloss7_protocol
  - _self_

experiment:
  # C-core uses one quarter of the DrivAerML encoder budget. The native cloud
  # remains available for density estimation before two fixed-budget views are drawn.
  num_body_points: 0
  view_geometry_points: 32768
  primary_view_geometry_points: 32768
  secondary_view_geometry_points: 32768
  shared_shift_view_geometry_points: 32768
  eval_view_geometry_points: 32768
  eval_aligned_view_geometry_points: 32768
  eval_shifted_view_geometry_points: 32768
  train_shared_shift_sampling_mode: "random_beta_sine"
  shared_shift_family_probabilities: [0.3333333333, 0.3333333333, 0.3333333334]
  shared_shift_beta_min: 0.0
  shared_shift_beta_max: 1.0
  shared_shift_sine_min: 0.0
  shared_shift_sine_max: 1.0
  epochs: 150

