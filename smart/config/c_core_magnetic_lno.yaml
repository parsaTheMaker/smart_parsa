defaults:
  - c_core_magnetic_common
  - _self_

experiment:
  name: "C_CORE_MAGNETIC_LNO_BASE"
  model_name: "LNO_C_CORE_MAGNETIC"
  num_body_points: 16384
  batch_size: 2
  architecture:
    n_block: 8
    n_mode: 256
    n_dim: 256
    n_head: 8
    n_layer: 2
    attn: "Galerkin"
    activation: "GELU"
    pos_scale_factor: 1.0
    query_chunk_size: 65536
    dropout: 0.0
    normalize_scores: true
    encode_score_temperature: 2.0
    decode_score_temperature: 1.0
