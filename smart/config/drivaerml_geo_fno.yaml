defaults:
  - drivaerml_architecture_common
  - _self_

wandb:
  mode: "online"

experiment:
  name: "DrivAerML_GeoFNO_MEDIUM_BASE"
  model_name: "GEOFNO"
  model_tag: "medium-v2-raw65k"
  batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  cuda_batch_prefetch: True
  architecture:
    # Use the same raw geometry budget as the established 65k DrivAerML
    # cross-architecture baselines before the model's own Fourier encoding.
    geometry_points: 65536
    # Medium 3D Geo-FNO: direct input/output spectral maps plus three
    # Fourier-grid blocks. The 9^3 direct stencil resolves substantially more
    # geometry variation than the initial 7^3 smoke configuration.
    width: 64
    modes: 5
    latent_resolution: 24
    num_fourier_blocks: 4
    source_chunk_size: 4096
    query_chunk_size: 8192
    iphi_width: 128
    iphi_fourier_bands: 8
    max_deformation: 0.25
    normalize_source_transform: True
    enable_tf32: True
