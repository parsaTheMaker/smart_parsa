defaults:
  - drivaerml
  - _self_

experiment:
  name: "DrivAerML_POINT_TRANSFORMER_V3"
  model_name: "POINT_TRANSFORMER_V3"
  architecture:
    in_channels: 3
    grid_size: 0.0078125
    latent_dim: 192
    num_latents: 64
    order: [z, z-trans, hilbert, hilbert-trans]
    stride: [2, 2, 2, 2]
    enc_depths: [1, 1, 2, 4, 1]
    enc_channels: [24, 48, 96, 192, 256]
    enc_heads: [2, 4, 4, 8, 16]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
    dec_depths: [1, 1, 1, 1]
    dec_channels: [48, 48, 96, 192]
    dec_heads: [2, 2, 4, 8]
    dec_patch_size: [1024, 1024, 1024, 1024]
    mlp_ratio: 2.0
    drop_path: 0.3
    shuffle_orders: true
    enable_flash: true
    spconv_algo: native
    attn_drop: 0.0
    proj_drop: 0.0
    pos_scale_factor: 100
    query_chunk_size: 65536
    local_query_neighbors: 4
    local_query_chunk_size: 8192
    use_local_query_features: true
    geometry_input_scale: 1.0
    voxel_density_power: 0.0
    preserve_density: false
    dropout: 0.0
  optimizer: "adamw"
  loss_fn: "rel_l2"
  scheduler: "cosine"
  scheduler_warmup_fraction: 0.2
  batch_size: 4
  epochs: 300
  learning_rate: 2.e-4
  # PTv3 stability is handled by the repo-faithful BN/CPE implementation and
  # AMP finite-step handling, not by constraining the optimizer update norm.
  gradient_norm: null
  track_gradient_diagnostics: true
  amp: true
  precision: "float16"
  # Keep FP16 scaling conservative for sparse-attention backward passes.
  amp_scaler_init_scale: 1024.0
  amp_scaler_growth_interval: 1000000
  amp_scaler_reset_on_resume: true
  scheduler_reset_on_resume: true
  log_every_n_steps: 10
  wandb_watch_model: false
  init_ckpt: ""
  resume_ckpt: ""
  resume_full_state: false
  # Plain-Python DataParallel is opt-in; the default keeps single-GPU behavior.
  multi_gpu_strategy: "single"
  cuda_batch_prefetch: true
  geometry_epoch_seeded_sampling: true
  num_body_points: 131072
