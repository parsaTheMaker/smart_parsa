defaults:
  - drivaerml_point_transformer_v3_satloss8
  - _self_

experiment:
  name: "DrivAerML_POINT_TRANSFORMER_V3_SATLOSS8_DENSITY_SENSITIVE_GEOMETRY_DOMAIN"
  model_name: "POINT_TRANSFORMER_V3_SATLOSS8"
  epochs: 250
  batch_size: 1
  architecture:
    order: [z, hilbert]
    shuffle_orders: false
    voxel_density_power: 0.75
    preserve_density: true
    # Cap only the auxiliary local-query KNN support; the PTv3 encoder still
    # receives the full geometry view.
    subsampled_geometry_points: 16384
    local_query_chunk_size: 16384
