defaults:
  - drivaerml_satloss6
  - _self_

experiment:
  name: "DrivAerML_POINTNET2_SSG_SATLOSS6"
  model_name: "POINTNET2_SSG_SATLOSS6"
  init_ckpt: ""
  architecture:
    latent_dim: 256
    # Keep the architecture identical to vanilla PointNet++ SSG.  Radii are
    # expressed in normalized DrivAerML coordinates.
    sa1_npoint: 2048
    sa1_radius: 0.02
    sa1_nsample: 64
    sa2_npoint: 512
    sa2_radius: 0.05
    sa2_nsample: 128
    query_neighbors: 3
    # Keep vanilla and SATLOSS6 architecturally identical while preserving
    # input-density shifts in the set-abstraction centroids.
    centroid_sampling: random
    density_histogram_bins: 8
    pos_scale_factor: 1.0
    query_chunk_size: 65536
    dropout: 0.0
  view_geometry_points: 65536
  eval_view_geometry_points: 65536
  geometry_epoch_seeded_sampling: False
  cuda_batch_prefetch: True
