defaults:
  - drivaerml_satloss7
  - _self_

experiment:
  name: "DrivAerML_SMART_SATLOSS7_GRADNORM"
  model_name: "SMART_SATLOSS7_GRADNORM"
  model_tag: ""
  epochs: 150
  track_gradient_diagnostics: True
  init_ckpt: ""
  resume_ckpt: ""
  resume_full_state: False

  # Original GradNorm on the three SATLOSS7 terms. The reference gradient is
  # measured on the shared geometry encoder, globally averaged under DDP.
  task_weighting_method: "gradnorm"
  use_learned_task_weighting: False
  balancing_task_mode: "view_losses"
  config_task_base_weights: [0.2, 0.2, 0.6]
  external_gradnorm_lr: 1.e-4
  external_gradnorm_alpha: 1.5
  external_gradnorm_initial_losses_decay: 1.0
  external_gradnorm_update_after_step: 0
  external_gradnorm_update_every: 1
