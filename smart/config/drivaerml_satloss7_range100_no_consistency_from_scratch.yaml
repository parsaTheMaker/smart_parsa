defaults:
  - drivaerml_satloss7_range100
  - _self_

experiment:
  name: "DrivAerML_SMART_SATLOSS7_RANGE_100_NO_CONSISTENCY_FROM_SCRATCH"
  model_name: "SMART_SATLOSS7_RANGE100_NO_CONSISTENCY_FROM_SCRATCH"
  epochs: 200
  use_prediction_consistency: False

  # Preserve the two supervised-view coefficients without reallocating the
  # inactive consistency coefficient.
  config_task_base_weights: [0.2, 0.2, 0.6]
  fixed_sum_normalize_weights: False
  init_ckpt: ""
  resume_ckpt: ""
  resume_full_state: False
