defaults:
  - drivaerml_satloss7
  - _self_

experiment:
  name: "DrivAerML_SMART_SATLOSS7_RANGE_500"
  model_name: "SMART_SATLOSS7_RANGE500"
  model_tag: ""
  epochs: 250

  # The range-ablation endpoint is the inverse-density beta.  The sine
  # mixture fraction remains a probability and is therefore kept in [0, 1].
  shared_shift_beta_min: 0.0
  shared_shift_beta_max: 5.0
  shared_shift_sine_min: 0.0
  shared_shift_sine_max: 1.0
