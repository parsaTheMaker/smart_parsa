defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

wandb:
  project: "smart"
  entity: "parsa-vatani99-technical-university-of-munich"

experiment:
  name: "DrivAerML_TRANSOLVERPP"
  model_name: "TRANSOLVERPP"
  model_tag: ""
  random_seed: 42
  manifest_variant: "full"

  architecture:
    latent_dim: 256
    latent_geometry_points: 4096
    subsampled_geometry_points: 65536
    num_encoder_decoder_blocks: 6
    num_heads: 8
    pos_scale_factor: 100
    slice_num: 64
    mlp_ratio: 2
    use_checkpoint: False
    token_chunk_size: 8192
    use_gumbel_routing: False

  optimizer: "adamw"
  loss_fn: "rel_l2"
  scheduler: "cosine"
  scheduler_warumup_fraction: 0.2
  batch_size: 1
  epochs: 300
  learning_rate: 2.e-4
  gradient_norm: 1.0
  amp: True
  precision: "float16"
  log_every_n_steps: 10
  wandb_watch_model: False
  resume_ckpt: ""

  dataset: "DrivAerML"
  data_path: "/mnt/ssdraid/parsa/drivaerml_preprocessed"
  num_workers: 8
  prefetch_factor: 4
  pin_memory: True
  num_body_points: 0
  num_surface_points: 65536
  num_volume_points: 65536
  scale_positions: False
