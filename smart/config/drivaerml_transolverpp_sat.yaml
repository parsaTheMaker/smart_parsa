defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

wandb:
  project: "smart"
  entity: "parsa-vatani99-technical-university-of-munich"

experiment:
  name: "DrivAerML_TRANSOLVERPP_SAT"
  model_name: "TRANSOLVERPP_SAT"
  model_tag: ""
  random_seed: 42
  manifest_variant: "full"

  architecture:
    n_layers: 4
    n_hidden: 256
    n_heads: 8
    dropout: 0.1
    mlp_ratio: 2
    slice_num: 32
    geometry_points: 16384
    density_knn_k: 8
    density_neighbor_hops: 1
    density_estimator: "rk2"

  optimizer: "adamw"
  loss_fn: "rel_l2"
  scheduler: "cosine"
  batch_size: 1
  epochs: 300
  learning_rate: 2.e-4
  gradient_norm: null
  amp: True
  precision: "float16"
  log_every_n_steps: 10
  wandb_watch_model: False
  resume_ckpt: ""

  dataset: "DrivAerML"
  data_path: "/mnt/ssdraid/parsa/drivaerml_preprocessed"
  num_workers: 8
  prefetch_factor: 4
  pin_memory: True
  geometry_density_cache_dtype: "float16"
  density_knn_k: 8
  density_neighbor_hops: 1
  density_estimator: "rk2"
  num_body_points: 32768
  num_surface_points: 65536
  num_volume_points: 65536
  scale_positions: False
