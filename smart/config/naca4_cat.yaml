defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

wandb:
  project: "smart"
  entity: "parsa-vatani99-technical-university-of-munich"

experiment:
  name: "NACA4_CAT"
  model_name: "CAT"
  model_tag: "cat"
  random_seed: 42
  manifest_variant: "full"

  # CAT stage: 1 (geometry pretrain), 2 (surface pretrain), 3 (volume training)
  cat_stage: 1

  # Stage query budget (stage1 volume query is auto-set equal to stage3).
  stage3_volume_query_points: 65536

  # Stage 3 pretrained checkpoints (required when cat_stage=3)
  stage3_geometry_ckpt: ""
  stage3_surface_ckpt: ""

  # Model configuration (kept aligned with naca4.yaml)
  architecture:
    latent_dim: 128
    num_encoder_decoder_blocks: 6
    pos_scale_factor: 100
    stage1_surface_attr_channels: 2
    stage1_volume_attr_channels: 1
    stage2_surface_channels: 1

  optimizer: "adamw"
  loss_fn: "rel_l2"
  scheduler: "cosine"
  scheduler_warumup_fraction: 0.2
  batch_size: 8
  epochs: 300
  learning_rate: 2.e-4
  gradient_norm: null
  amp: True
  precision: "float16"
  log_every_n_steps: 10

  dataset: "NACA4"
  data_path: "/mnt/data1/parsa/naca4_zenodo_airfrans_like/Dataset"
  num_workers: 8
  num_body_points: -1
  num_surface_points: -1
  num_volume_points: 65536
  scale_positions: False
