defaults:
  - pump_lno
  - pump_deal_satloss7_protocol
  - _self_

experiment:
  name: "PUMP_LNO_DEAL_FROM_BASE"
  model_name: "LNO_PUMP_DEAL"
  model_tag: "from-base-150ep"
  batch_size: 1
  multi_gpu_strategy: "single"
  # The matched LNO base is trained in BF16; FP16 overflows its latent
  # projections immediately after loading that checkpoint.
  precision: "bfloat16"

wandb:
  mode: "disabled"
