defaults:
  - shift_crash
  - _self_

experiment:
  name: "SHIFT_CRASH_SMART_SATLOSS7"
  model_name: "SMART_SHIFT_CRASH_SATLOSS7"
  model_tag: ""
  epochs: 250
  batch_size: 8
  geometry_epoch_seeded_sampling: False
  num_workers: 4
  prefetch_factor: 2
  log_every_n_steps: 5

  # SATLoss7 samples two views from the complete reference cloud.  Each batch
  # uses exactly one family: beta, sine-y, or sine-x, with both view values
  # sampled from the configured range.
  # The source remains the complete 376,593-point cloud; only each sampled
  # SATLoss view follows the one-quarter 32,768-point budget.
  num_body_points: 0
  view_geometry_points: 32768
  eval_view_geometry_points: 32768
  density_voxel_resolution: 96
  shared_shift_family_probabilities: [0.3333333333, 0.3333333333, 0.3333333334]
  shared_shift_beta_min: 0.0
  shared_shift_beta_max: 1.0
  shared_shift_sine_min: 0.0
  shared_shift_sine_max: 1.0
  train_shared_shift_sampling_mode: "random_beta_sine"
  use_prediction_consistency: True
  prediction_consistency_weight: 1.0
  # Match predictions with a target-relative L2 response, in the same units
  # as both supervised terms.  The legacy SmoothL1 beta is retained only for
  # backwards-compatible override files and is not used by this protocol.
  prediction_consistency_smooth_l1_beta: 0.1
  prediction_consistency_symmetric_detached: True
  consistency_warmup_epochs: 0
  fuse_consistency_views: True
  task_weighting_method: "fixed_sum"
  config_task_base_weights: [0.2, 0.2, 0.6]
  fixed_sum_use_view_losses: True
  use_learned_task_weighting: False
