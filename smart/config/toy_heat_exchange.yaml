defaults:
  - toy_heat_exchange_common
  - _self_

experiment:
  name: "TOY_HEAT_EXCHANGE_SMART_BASE"
  model_name: "SMART_TOY_HEAT_EXCHANGE"
  model_tag: ""
  # Within the 65,536-point encoder view, SMART uses 1/8 cross-attention
  # support and then 1/4 latent anchors, matching DrivAerML's hierarchy.
  architecture:
    latent_dim: 256
    latent_geometry_points: 2048
    subsampled_geometry_points: 8192
    subsampled_geometry_with_replacement: True
    num_encoder_decoder_blocks: 6
    pos_scale_factor: 100
