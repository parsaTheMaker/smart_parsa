defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

wandb:
  project: "smart_toy_heat_exchange"
  entity: "parsa-vatani99-technical-university-of-munich"

experiment:
  name: "TOY_HEAT_EXCHANGE"
  model_name: "TOY_HEAT_EXCHANGE"
  model_tag: ""
  random_seed: 42
  dataset: "ToyHeatExchange"
  data_path: "/mnt/ssdraid/parsa/toy_heat_exchange_fem_v1"
  coordinate_normalization: "global_train_bounds"
  # Vanilla models receive a new uniform encoder cloud each epoch. SATLOSS7
  # overrides this to draw its two density-shifted views from the full cloud.
  geometry_epoch_seeded_sampling: True
  # DrivAerML-aligned fractions for the 524,288-point native geometry cloud:
  # 1/8 encoder input and 1/16 for each surface/volume query set.
  num_body_points: 65536
  num_surface_points: 32768
  num_volume_points: 32768
  scale_positions: False
  optimizer: "adamw"
  loss_fn: "rel_l2"
  scheduler: "cosine"
  scheduler_warmup_fraction: 0.2
  batch_size: 1
  epochs: 300
  learning_rate: 2.e-4
  gradient_norm: null
  amp: True
  precision: "float16"
  log_every_n_steps: 10
  track_gradient_diagnostics: False
  wandb_watch_model: False
  multi_gpu_strategy: "single"
  resume_ckpt: ""
  resume_full_state: False
  init_ckpt: ""
  num_workers: 8
  prefetch_factor: 4
  pin_memory: True
  cuda_batch_prefetch: True
