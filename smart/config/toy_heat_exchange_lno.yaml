defaults:
  - toy_heat_exchange_common
  - _self_

experiment:
  name: "TOY_HEAT_EXCHANGE_LNO_BASE"
  model_name: "LNO_TOY_HEAT_EXCHANGE"
  batch_size: 4
  architecture:
    # Match the DrivAerML LNO comparison architecture.
    n_block: 8
    n_mode: 256
    n_dim: 256
    n_head: 8
    n_layer: 2
    attn: "Galerkin"
    activation: "GELU"
    pos_scale_factor: 1.0
    query_chunk_size: 65536
    dropout: 0.0
    normalize_scores: True
    encode_score_temperature: 2.0
    decode_score_temperature: 1.0
