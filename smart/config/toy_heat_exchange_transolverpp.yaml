defaults:
  - toy_heat_exchange_common
  - _self_

experiment:
  name: "TOY_HEAT_EXCHANGE_TRANSOLVERPP_BASE"
  model_name: "TRANSOLVERPP_TOY_HEAT_EXCHANGE"
  batch_size: 2
  architecture:
    # Match the DrivAerML Transolver++ comparison architecture.
    n_layers: 4
    n_hidden: 256
    n_heads: 8
    dropout: 0.1
    mlp_ratio: 2
    slice_num: 32
    geometry_points: 0
    use_token_type_embeddings: True
