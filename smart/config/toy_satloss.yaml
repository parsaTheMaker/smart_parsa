defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

wandb:
  project: "smart_toy_satloss"
  entity: "parsa-vatani99-technical-university-of-munich"

experiment:
  name: "TOY_SATLOSS_SMART_BASE"
  model_name: "SMART_TOY"
  model_tag: ""
  random_seed: 42
  dataset: "ToySATLoss"
  data_path: "/mnt/ssdraid/parsa/toy_satloss_poisson_benchmark_v2"
  coordinate_normalization: "global_train_bounds"
  # The baseline sees a reproducible uniform subset of the native, nonuniform cloud.
  geometry_epoch_seeded_sampling: True
  # Preserve the DrivAerML hierarchy relative to the 131K stored source cloud:
  # 131K source -> 16K encoder input -> 2K internal points -> 512 anchors.
  num_body_points: 16384
  num_surface_points: 8192
  num_volume_points: 8192
  scale_positions: False
  architecture:
    latent_dim: 192
    latent_geometry_points: 512
    subsampled_geometry_points: 2048
    subsampled_geometry_with_replacement: True
    num_encoder_decoder_blocks: 6
    pos_scale_factor: 100
  optimizer: "adamw"
  loss_fn: "rel_l2"
  scheduler: "cosine"
  scheduler_warmup_fraction: 0.1
  batch_size: 4
  epochs: 250
  learning_rate: 2.e-4
  gradient_norm: null
  amp: True
  precision: "float16"
  log_every_n_steps: 10
  track_gradient_diagnostics: False
  wandb_watch_model: False
  multi_gpu_strategy: "single"
  resume_ckpt: ""
  resume_full_state: False
  init_ckpt: ""
  num_workers: 8
  prefetch_factor: 4
  pin_memory: True
  cuda_batch_prefetch: True
